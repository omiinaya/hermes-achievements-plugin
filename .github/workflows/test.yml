name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # ruff is bounded (<0.17) on purpose: newer ruff majors ship new
        # default rulesets that broke CI once while local ruff passed
        # (N999 incident, v2.4.2). Patch releases still land automatically.
        run: python -m pip install --upgrade pip pytest pytest-cov "ruff>=0.15.14,<0.17"
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Coverage gate
        # 99% floor (was 95%): the plugin module holds 100% line coverage
        # and the full tree 99.7% (the only misses are inside the test
        # files themselves — testing the tests is circular). A lower gate
        # would let a new hook branch ship untested without CI noticing.
        run: python -m pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=99 -q
      - name: Branch coverage gate
        # The plugin module is 100% line AND 100% branch (680/680). The
        # combined --cov-branch number dips below 99% only because the
        # test files carry their own partial branches — circular. Gate the
        # module alone so a new defensive branch ships without an edge
        # test the moment it's added.
        run: python -m pytest tests/ --cov=achievements --cov-branch --cov-report=term-missing --cov-fail-under=100 -q
      - name: Lint
        run: ruff check .
      - name: Verify README tables match definitions
        run: |
          python scripts/render_readme.py
          git diff --exit-code -- README.md || {
            echo "README.md is out of sync — run: python scripts/render_readme.py"
            exit 1
          }
