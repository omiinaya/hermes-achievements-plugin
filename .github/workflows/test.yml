name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # ruff is bounded (<0.17) on purpose: newer ruff majors ship new
        # default rulesets that broke CI once while local ruff passed
        # (N999 incident, v2.4.2). Patch releases still land automatically.
        run: python -m pip install --upgrade pip pytest pytest-cov "ruff>=0.15.14,<0.17"
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Coverage gate
        run: python -m pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=90 -q
      - name: Lint
        run: ruff check .
      - name: Verify README tables match definitions
        run: |
          python scripts/render_readme.py
          git diff --exit-code -- README.md || {
            echo "README.md is out of sync — run: python scripts/render_readme.py"
            exit 1
          }
