name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # ruff is bounded (<0.17) on purpose: newer ruff majors ship new
        # default rulesets that broke CI once while local ruff passed
        # (N999 incident, v2.4.2). Patch releases still land automatically.
        run: python -m pip install --upgrade pip pytest pytest-cov "ruff>=0.15.14,<0.17"
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Coverage gate
        # 99% floor (was 95%): the plugin module holds 100% line coverage
        # and the full tree 99.7% (the only misses are inside the test
        # files themselves — testing the tests is circular). A lower gate
        # would let a new hook branch ship untested without CI noticing.
        run: python -m pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=99 -q
      - name: Branch coverage gate
        # The plugin MODULE is gated on its own (pyproject sets
        # include=["__init__.py"], so this reports the module alone, not
        # the test files' own partial branches).
        #
        # History: this step used `--cov=achievements`, which matched no
        # importable module — the plugin is a top-level `__init__.py` loaded
        # via spec_from_file_location, never as package `achievements`. It
        # reported 0% and FAILED on every run while claiming to be a 100%
        # branch gate: a gate that measures nothing. Fixed in 2.23.0.
        #
        # Threshold is the MEASURED floor. With branch=true the module's
        # combined line+branch figure is 98.67% (24 lines + 9 partial
        # branches missed); the residual misses are defensive paths
        # unreachable without a real Windows/non-POSIX or malformed-payload
        # input. The old `--cov-fail-under=100` claimed perfection that the
        # plugin never had; this gate fails on any REAL regression instead.
        #
        # NOTE the `--cov=.`: --cov-config only supplies the config, pytest-cov
        # still needs --cov to know what to measure. Without it the run
        # reports nothing at all and the gate passes vacuously.
        run: python -m pytest tests/ --cov=. --cov-config=coverage-module-only.rc --cov-report=term-missing --cov-fail-under=98 -q
      - name: Lint
        run: ruff check .
      - name: Verify README tables match definitions
        run: |
          python scripts/render_readme.py
          git diff --exit-code -- README.md || {
            echo "README.md is out of sync — run: python scripts/render_readme.py"
            exit 1
          }
