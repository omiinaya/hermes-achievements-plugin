name: achievements
version: 2.6.0
description: "107 Steam-style achievement badges for Hermes Agent with i18n support (EN/ES/FR/PT). Tracks tool usage, tokens, delegation, approvals, API resilience, milestones, and platform exploration."
pip_dependencies: []
hooks:
  - post_llm_call
  - post_api_request
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_reset
  - on_session_finalize
  - subagent_stop
  - subagent_start
  - post_approval_response
  - pre_approval_request
  - api_request_error
  - pre_gateway_dispatch
