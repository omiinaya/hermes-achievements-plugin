name: achievements
version: 2.3.0
description: "100 Steam-style achievement badges for Hermes Agent with i18n support (EN/ES/FR/PT). Tracks tool usage, delegation, approvals, milestones, and platform exploration."
pip_dependencies: []
hooks:
  - post_llm_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - subagent_stop
  - post_approval_response
  - on_session_reset
