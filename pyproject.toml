[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "hermes-achievements-plugin"
version = "2.8.0"
description = "114 Steam-style achievement badges for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["hermes", "achievements", "plugin", "gamification"]
authors = [
  { name = "Hermes Achievements Contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/omiinaya/hermes-achievements-plugin"
Repository = "https://github.com/omiinaya/hermes-achievements-plugin"
Issues = "https://github.com/omiinaya/hermes-achievements-plugin/issues"

# The plugin is a single module at the repo root (Hermes loads plugins from
# their directory via plugin.yaml + __init__.py). Package it as a py-module
# so the wheel actually ships the code, plus the manifest and locales.
[tool.setuptools]
py-modules = ["__init__"]

# Extra files ship alongside the module so a pip-installed wheel is
# self-contained (manifest + translations). Loaded via __file__ fallback
# in _load_locales / register.
[tool.setuptools.data-files]
"achievements" = ["plugin.yaml", "locales/*.json"]

# The plugin directory name (hermes-achievements-plugin) contains hyphens,
# so ruff's N999 flags it as an invalid module name. This is a false
# positive — the directory is a *plugin* (loaded via plugin.yaml), not an
# importable Python module.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
