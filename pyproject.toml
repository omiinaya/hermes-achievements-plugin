[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "hermes-achievements-plugin"
version = "2.18.8"
description = "153 Steam-style achievement badges for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["hermes", "achievements", "plugin", "gamification"]
authors = [
  { name = "Hermes Achievements Contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/omiinaya/hermes-achievements-plugin"
Repository = "https://github.com/omiinaya/hermes-achievements-plugin"
Issues = "https://github.com/omiinaya/hermes-achievements-plugin/issues"

# The plugin is a single module at the repo root (Hermes loads plugins from
# their directory via plugin.yaml + __init__.py). In the wheel it ships as
# the `achievements` package (mapped from the repo root) so pip-installed
# entry-point loading gets a REAL module name — a top-level `__init__`
# module collides with Python package machinery during PluginManager
# discovery (sys.modules['__init__'] gets hijacked by another package).
[tool.setuptools]
packages = ["achievements"]
py-modules = []
[tool.setuptools.package-dir]
achievements = "."

# Extra files ship alongside the module so a pip-installed wheel is
# self-contained (manifest + translations). Loaded via __file__ fallback
# in _load_locales / register.
[tool.setuptools.data-files]
"achievements" = ["plugin.yaml", "locales/*.json"]

# Register with the Hermes plugin loader (group "hermes_agent.plugins") so
# `pip install hermes-achievements-plugin` is discovered by PluginManager
# via importlib.metadata entry points, exactly like any user/checkout
# plugin — no manual ~/.hermes/plugins copy needed.
[project.entry-points."hermes_agent.plugins"]
achievements = "achievements"

# The plugin directory name (hermes-achievements-plugin) contains hyphens,
# so ruff's N999 flags it as an invalid module name. This is a false
# positive — the directory is a *plugin* (loaded via plugin.yaml), not an
# importable Python module.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]

# Plugin is fully synchronous — no async tests exist. pytest-asyncio may
# still be present in the environment (auto-loaded plugin); disabling it
# avoids both its deprecation warning locally and any async-fixture
# surprises. `no:` prefix is a safe no-op when the plugin isn't installed.
[tool.pytest.ini_options]
addopts = "-p no:asyncio"

# Mutation testing (run: uvx mutmut run)
[tool.mutmut]
source_paths = "__init__.py"
pytest_add_cli_args_test_selection = ["tests/"]
runner = "python -m pytest -q -x"

