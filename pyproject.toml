[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "hermes-achievements-plugin"
version = "2.2.1"
description = "100 Steam-style achievement badges for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["hermes", "achievements", "plugin", "gamification"]
authors = [
  { name = "Hermes Achievements Contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/omiinaya/hermes-achievements-plugin"
Repository = "https://github.com/omiinaya/hermes-achievements-plugin"
Issues = "https://github.com/omiinaya/hermes-achievements-plugin/issues"

[tool.setuptools.packages.find]
include = ["achievements*"]
